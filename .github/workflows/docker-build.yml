name: Build and Push Docker Image to Azure ACR

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Log in to Azure Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ secrets.ACR_LOGIN_SERVER }}
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ${{ secrets.ACR_LOGIN_SERVER }}/national-id-bot:latest
          ${{ secrets.ACR_LOGIN_SERVER }}/national-id-bot:${{ github.sha }}

    # Add this step to AUTOMATICALLY update the Azure Container App
    - name: Deploy to Azure Container Apps
      uses: azure/container-apps-deploy-action@v1
      with:
        # These credentials are usually needed for the deploy action
        # You might need to set up 'AZURE_CREDENTIALS' in GitHub Secrets
        # OR use the username/password method if your policy allows.
        registryUrl: ${{ secrets.ACR_LOGIN_SERVER }}
        registryUsername: ${{ secrets.ACR_USERNAME }}
        registryPassword: ${{ secrets.ACR_PASSWORD }}
        
        containerAppName: national-id-bot
        resourceGroup: national-id-bot  # Check your actual Resource Group name in Azure
        imageToDeploy: ${{ secrets.ACR_LOGIN_SERVER }}/national-id-bot:${{ github.sha }}